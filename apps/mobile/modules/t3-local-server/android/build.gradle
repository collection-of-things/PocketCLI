apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

group = 'com.t3tools.localserver'
version = '0.0.0'

android {
  namespace 'expo.modules.t3localserver'
  compileSdk rootProject.ext.compileSdkVersion
  defaultConfig {
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
  }
  // `runtime/` comes from scripts/fetch-android-runtime.ts: jniLibs/arm64-v8a
  // holds libnode.so and libnodepty.so, assets holds pocketcli-server.zip.
  // Without it the module still builds and reports the server as unavailable.
  sourceSets {
    main {
      jniLibs.srcDirs += 'runtime/jniLibs'
      assets.srcDirs += 'runtime/assets'
    }
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation 'androidx.core:core:1.17.0'
}
