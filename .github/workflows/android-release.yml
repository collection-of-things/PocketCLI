name: Android Release

# Push a version tag to publish an installable APK as a GitHub release:
#
#   git tag v0.1.0-alpha.1 && git push origin v0.1.0-alpha.1
#
# Tags with a suffix (-alpha.N, -beta.N, -rc.N) become prereleases. Builds the
# production variant (com.pocketcli.app, pocketcli:// links, which the Termux
# launcher opens) with the on-device server from the android-runtime workflow.
#
# The APK is signed with the runner's throwaway debug key. Installing a newer
# release over an older one therefore fails until a release keystore is wired
# in; uninstall the previous build first.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      APP_VARIANT: production
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Resolve version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Read by app.config.ts during both prebuild and the Gradle build.
          echo "POCKETCLI_APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "POCKETCLI_ANDROID_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Checkout
        uses: actions/checkout@v6

      # The runtime for this commit may still be compiling (Node takes over an
      # hour on a cold cache). Wait for that run instead of shipping a stale one.
      - name: Wait for the Android runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 150); do
            state="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow android-runtime.yml --commit "$GITHUB_SHA" --limit 1 --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"' || true)"
            case "$state" in
              "") echo "No runtime run for this commit; using the latest published runtime."; break ;;
              "completed success") echo "Runtime for $GITHUB_SHA is published."; break ;;
              completed*) echo "The android-runtime run for this commit failed ($state)." >&2; exit 1 ;;
              *) echo "Runtime still building ($state); checking again in 2 minutes."; sleep 120 ;;
            esac
          done
          gh release view android-runtime-latest --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch the Android runtime
        run: node apps/mobile/scripts/fetch-android-runtime.ts

      - name: Generate the native project
        working-directory: apps/mobile
        env:
          EXPO_NO_GIT_STATUS: "1"
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          apk="PocketCLI-${VERSION}-arm64.apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$apk"
          notes_file="$RUNNER_TEMP/notes.md"
          {
            echo "PocketCLI ${VERSION} for Android 10+ (arm64). Built from ${GITHUB_SHA}."
            echo
            echo "The app starts its own server on the phone. Codex is not bundled into the app yet;"
            echo "until it is, run agents through the Termux setup (docs/user/termux.md)."
            echo
            echo "Signed with a throwaway key: uninstall any earlier PocketCLI test build before installing this one."
          } > "$notes_file"
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "$apk" --title "PocketCLI ${VERSION}" --notes-file "$notes_file" "${flags[@]}"
